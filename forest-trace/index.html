<style>
:root{--paper:#f4f2ea;--ink:#232a26;--muted:#66706a;--green:#2f5d50;--accent:#b8743a;--line:#dfdccf}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans TC',system-ui,sans-serif;color:var(--ink);background:#1b2622;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{display:flex;height:100vh;height:100dvh}
#stage{position:relative;flex:1;min-width:0;overflow:hidden;background:#cfdcd2}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:7px;background:#fffefa;border-radius:999px;padding:5px 12px 5px 6px;font-weight:700;font-size:13px;white-space:nowrap;box-shadow:0 2px 10px rgba(20,35,30,.2);cursor:pointer;transition:background .2s,color .2s,opacity .25s;will-change:transform}
.lab .n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700}
.lab .ok{font-size:11px;color:var(--green)}
.lab.sel{background:var(--green);color:#fff}.lab.sel .ok{color:#cfe6d4}
.lab.dim{opacity:.4}
.pk{position:absolute;left:0;top:0;pointer-events:none;font-size:12px;font-weight:700;color:#2b3a33;white-space:nowrap;text-shadow:0 0 4px #fff,0 0 8px #fff;will-change:transform;text-align:center;line-height:1.25}
.pk small{display:block;font-weight:500;font-size:10.5px;color:#55625b}
.night .pk{color:#e3ece6;text-shadow:0 0 6px #000}.night .pk small{color:#b6c4bc}
.hide-labels .lab,.hide-labels .pk{opacity:0;pointer-events:none}
.brand{position:absolute;top:20px;left:20px;background:rgba(244,242,234,.95);border-radius:18px;padding:16px 22px 16px 20px;box-shadow:0 6px 24px rgba(20,30,28,.16);display:flex;gap:16px;align-items:center}
.brand .big{font-family:'Noto Serif TC',serif;font-weight:900;font-size:36px;line-height:1.05;color:var(--green);letter-spacing:.03em}
.brand .big i{font-style:normal;color:var(--accent)}
.brand .en{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:22px;color:var(--accent);line-height:1}
.brand .sub{font-size:12px;letter-spacing:.18em;color:var(--muted);margin-top:8px;font-weight:500;line-height:1.7}
.topctl{position:absolute;top:20px;right:20px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.pill{border:0;background:rgba(244,242,234,.95);border-radius:999px;padding:9px 16px;font-weight:500;font-size:14px;cursor:pointer;box-shadow:0 4px 16px rgba(20,30,28,.14);transition:background .2s,color .2s}
.pill.on{background:var(--green);color:#fff}
.pill.round{width:40px;padding:9px 0;text-align:center}
.chain{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:rgba(244,242,234,.96);border-radius:999px;padding:6px;box-shadow:0 6px 22px rgba(20,30,28,.18);max-width:calc(100% - 40px);overflow-x:auto;scrollbar-width:none}
.chain::-webkit-scrollbar{display:none}
.chain button{border:0;background:none;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;color:var(--muted);transition:background .2s,color .2s}
.chain button b{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:15px;margin-right:4px;color:var(--accent)}
.chain button.on{background:var(--green);color:#fff}.chain button.on b{color:#f2c879}
.chain .ar{color:#b9b5a6;font-size:12px}
.bl{position:absolute;left:22px;bottom:84px;max-width:380px}
.start{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:13px 22px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 6px 20px rgba(60,40,20,.25)}
.start.on{background:#7a3f2e}
.bl .hint{font-size:12.5px;margin-top:12px;color:#2b3a33;text-shadow:0 1px 6px rgba(255,255,255,.8)}
.night .bl .hint{color:#dfe7e1;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.br{position:absolute;right:20px;bottom:84px;display:flex;gap:8px}
#panel{width:440px;flex:none;background:var(--paper);overflow-y:auto;border-left:1px solid var(--line)}
.pin{padding:38px 34px 30px}
.eyebrow{font-size:11.5px;letter-spacing:.24em;color:var(--accent);font-weight:700}
#panel h1{font-family:'Noto Serif TC',serif;font-weight:900;font-size:34px;margin:10px 0 4px;line-height:1.3;color:var(--green)}
.h1en{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:22px;color:var(--accent);margin-bottom:18px}
.prog{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:50%;background:#d9d5c6;display:block}.dots i.on{background:var(--green)}
.intro{font-size:14.5px;line-height:1.95;color:#3f4741;margin:18px 0 6px}
.chapter{margin-top:22px}
.chapter .cq{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent);padding-bottom:6px;border-bottom:1px solid var(--line)}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:48px 1fr 18px;align-items:center;gap:6px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.list li:hover{background:rgba(47,93,80,.06)}
.num{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:28px;line-height:1}
.list .t{font-size:15px;font-weight:500}
.list .p{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.list .arw{color:var(--muted);font-size:14px}
.list li.v .t::after{content:" ✓";color:var(--green);font-size:12px}
.note{font-size:12px;color:var(--muted);line-height:1.8;margin-top:22px}
.refs{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:14px}
.refs p{margin:0 0 6px;padding-left:1.4em;text-indent:-1.4em}
.foot{margin-top:22px;font-size:12.5px;color:var(--muted);line-height:1.9}
.back{border:0;background:none;padding:0;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:22px}
.back:hover{color:var(--ink)}
.dhead{display:flex;align-items:flex-end;gap:14px}
.dnum{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:66px;line-height:.85}
.dq{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.06em;padding-bottom:6px}
.dt{font-family:'Noto Serif TC',serif;font-weight:900;font-size:28px;line-height:1.35;margin:14px 0 2px}
.den{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:19px;color:var(--muted)}
.blurb{font-size:15px;line-height:2;color:#333a35;margin:18px 0}
.blurb+.blurb{margin-top:-6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 18px}
.stat{background:#e9e6da;border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:'Noto Serif TC',serif;font-size:24px;color:var(--green);line-height:1.2}
.stat span{font-size:12px;color:var(--muted);line-height:1.5;display:block;margin-top:2px}
figure{margin:6px 0 18px}
figure img{width:100%;border-radius:10px;border:1px solid var(--line);background:#fff;display:block}
figcaption{font-size:12px;color:var(--muted);line-height:1.7;margin-top:6px}
.bars{margin:6px 0 18px}
.bars h5{margin:0 0 8px;font-size:13px;color:var(--ink)}
.bar{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:8px;font-size:12.5px;margin:5px 0}
.bar i{display:block;height:10px;border-radius:5px;background:var(--green)}
.bar em{font-style:normal;color:var(--muted);text-align:right}
.bars small{display:block;font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:6px}
.meta{display:grid;grid-template-columns:72px 1fr;gap:8px 10px;font-size:13.5px;line-height:1.7;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0}
.meta dt{color:var(--muted);font-weight:500}.meta dd{margin:0}
.nextq{margin:20px 0 0;background:#e9e6da;border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.8;cursor:pointer}
.nextq small{display:block;font-size:11px;letter-spacing:.2em;color:var(--accent);font-weight:700}
.nextq:hover{background:#e2dfd1}
.pn{display:flex;justify-content:space-between;margin-top:26px}
.pn button{border:0;background:none;cursor:pointer;font-size:13.5px;color:var(--muted);padding:4px 0;text-align:left;max-width:48%}
.pn button:last-child{text-align:right}.pn button:hover{color:var(--ink)}
.pn small{display:block;font-size:11px;letter-spacing:.15em;margin-bottom:3px}
.modal{position:absolute;inset:0;background:rgba(20,28,25,.45);display:none;align-items:center;justify-content:center;z-index:5}
.modal.show{display:flex}
.modal .card{background:var(--paper);border-radius:18px;padding:28px 30px;max-width:460px;width:calc(100% - 40px);line-height:1.9;font-size:14.5px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h4{font-family:'Noto Serif TC',serif;font-size:20px;margin:0 0 10px}
.modal ul{padding-left:20px;margin:0 0 16px}
.err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:15px;line-height:1.8;background:#cfdcd2}
@media (max-width:900px){
 #app{flex-direction:column}
 #stage{flex:none;height:60vh;height:60dvh}
 #panel{width:auto;flex:1;border-left:0;border-top:1px solid var(--line)}
 .pin{padding:24px 22px}
 .brand{top:12px;left:12px;padding:10px 14px}.brand .big{font-size:22px}.brand .en,.brand .sub{display:none}
 .topctl{top:12px;right:12px;gap:6px;max-width:58%}
 .pill{font-size:12.5px;padding:7px 11px}.pill.round{width:34px;padding:7px 0}
 .chain{bottom:10px}.chain button{padding:7px 10px;font-size:12px}
 .bl{left:12px;bottom:64px}.bl .hint{display:none}.start{padding:9px 14px;font-size:13px}
 .br{right:12px;bottom:64px}
 #panel h1{font-size:27px}
 .bar{grid-template-columns:120px 1fr 36px}
}
</style>

<body>
<div id="app">
 <div id="stage">
  <canvas id="c" aria-label="山徑脈動立體地圖"></canvas>
  <div id="labels"></div>
  <div class="brand">
   <div class="big">山徑<br>脈動<i>。</i></div>
   <div><div class="en">Forest Trace</div><div class="sub">森林步道<br>新世代監測模式</div></div>
  </div>
  <div class="topctl">
   <button class="pill on" id="bPulse">人流脈動</button>
   <button class="pill" id="bNight">☀ 白天</button>
   <button class="pill on" id="bLabel">名牌</button>
   <button class="pill round" id="bHelp" aria-label="操作說明">?</button>
  </div>
  <div class="bl">
   <button class="start" id="bTour">沿著山徑走一遍 →</button>
   <div class="hint">拖曳轉動 ・ 滾輪縮放 ・ 點站點閱讀</div>
  </div>
  <div class="br">
   <button class="pill round" id="zOut" aria-label="縮小">−</button>
   <button class="pill round" id="zIn" aria-label="放大">+</button>
   <button class="pill" id="bHome">回到全景</button>
  </div>
  <nav class="chain" id="chain"></nav>
  <div class="modal" id="help"><div class="card">
   <h4>怎麼走這條山徑</h4>
   <ul>
    <li>一條步道穿過谷關的森林與大甲溪，十個站點依監測流程排在步道旁的林間空地上。</li>
    <li>四周的山是谷關七雄，依相對方位與標高示意排列，並非精確地形。</li>
    <li>下方提問列是整條故事線：從「人來了多少」走到「如何變成決策」。</li>
    <li>站點說明中的數字來自電信信令統計與世界咖啡館工作坊；場景中的人物、長條與光點則是示意。</li>
   </ul>
   <button class="start" id="helpClose">知道了</button>
  </div></div>
  <div class="err" id="err">這個瀏覽器無法顯示 3D 場景，<br>請直接使用右側的故事清單。</div>
 </div>
 <aside id="panel"><div class="pin" id="pin"></div></aside>
</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

/* ================= content ================= */
const STEPS=[
 {k:'s0',label:'起點',q:'為什麼需要新世代監測？',ids:['core','base']},
 {k:'s1',label:'Q1',q:'人來了多少？',ids:['flow']},
 {k:'s2',label:'Q2',q:'人在哪裡？',ids:['vgi']},
 {k:'s3',label:'Q3',q:'數位足跡能不能代表他們？',ids:['valid']},
 {k:'s4',label:'Q4',q:'哪裡產生遊憩壓力？',ids:['impact','eco']},
 {k:'s5',label:'Q5',q:'管理者需要什麼？',ids:['needs']},
 {k:'s6',label:'Q6',q:'監測結果如何變成決策？',ids:['decide','gov']}
];
const WC='「森林遊憩新視野：新型數據與經營管理需求」世界咖啡館工作坊（2026 年 9 月 21 日）';
const bars=(title,rows,max,note,color='#2f5d50')=>`<div class="bars"><h5>${title}</h5>${rows.map(([k,v,lab])=>`<div class="bar"><span>${k}</span><i style="width:${(v/max*100).toFixed(1)}%;background:${color}"></i><em>${lab??v}</em></div>`).join('')}${note?`<small>${note}</small>`:''}</div>`;
const stats=a=>`<div class="stats">${a.map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('')}</div>`;
const ST=[
 {id:'core',zh:'監測核心',en:'Monitoring Core',color:'#2f5d50',t:[-30,18],
  text:['谷關七雄是中臺灣最具代表性的中級山群，年登山認證人數已突破兩萬人次。在山林開放的政策下，遊憩自由與風險管理之間的兩難日益急迫；定點調查、人力目測等傳統方法，難以長期而全面地掌握遊客人次與空間分布；人流計數器、Flickr、eBird、iTrail 等新興數據雖然成本低、涵蓋廣，「能不能信、該怎麼用」卻還沒有被系統性地問過第一線管理者。',
        '本計畫以谷關七雄為示範場域，整合雙向人流計數器、電信信令、自願地理資訊（VGI）、GIS 空間分析與管理者工作坊，建立一套能回答「人來了多少、人在哪裡、壓力在哪裡、該如何管理」的森林步道新世代監測模式。'],
  method:'示範場域：八仙山、馬崙山、屋我尾山、波津加山、東卯山、白毛山、唐麻丹山',
  output:'監測架構與示範流程',
  next:'要看見變化，得先知道比較的起點在哪裡。',refs:['marion2023','walden2018']},
 {id:'base',zh:'監測基線',en:'Monitoring Baseline',color:'#7a6a4f',t:[-17,22],
  text:['沒有基線，就無從判斷變化。監測的第一步，是為七條步道建立共同的空間與環境基準：路線與分段、坡度與地形、鋪面與植被現況、設施與出入口位置，並以 GIS 整合為統一的圖資架構。',
        '區域尺度的基線則來自內政部電信信令人口統計。以同為 11 月的兩期資料比較，和平區假日超額訪客從 109 年的約 11,605 人變為 112 年的約 6,402 人，平日夜間居民也從約 15,359 人降至約 12,864 人。單月快照受季節、活動與疫情等因素影響，不宜直接解讀為趨勢，但它提供了一條可以重複檢驗的參考線，讓後續的計數器與 VGI 資料有可以對照的背景。'],
  extra:()=>stats([['11,605 → 6,402','和平區假日超額訪客（109 → 112 年 11 月）'],['15,359 → 12,864','和平區平日夜間居民（同期）']]),
  method:'步道分段、數值地形分析、現況調查、電信信令跨年比較、GIS 圖資整合',
  output:'七條步道的監測基線圖資與區域人口參考線',
  next:'有了座標與參考線，接著要問：到底有多少人走進這片山？',refs:['marion2016']},
 {id:'flow',zh:'遊客人流',en:'Visitor Flow',color:'#3d7ea6',t:[-4,19],
  text:['「人來了多少」需要在兩個尺度上回答。在區域尺度，電信信令顯示 112 年 11 月和平區平日夜間居民約 12,864 人，假日日間活動人數約 19,266 人，超出居民的假日訪客約 6,402 人，相當於居民的五成；假日午後旅次也比平日增加約六成。以建築用地分區密度法把鄉鎮資料分派到 500 公尺方格後，可以看到這些訪客集中在臺 8 線與谷關一帶的聚落；假日夜間的淨流入約 2,900 人，居臺中市各區之首，反映山區旅宿的過夜需求。',
        '在步道尺度，則由登山口的雙向人流計數器分別記錄上山與下山的通過人次，掌握每日、每週與季節的使用強度，辨識假日與連假尖峰，並從進出差異推估停留時間。兩者互補：電信信令涵蓋廣，卻停在聚落與鄉鎮的尺度，看不見人走進了哪一條步道；計數器精確，卻只看得見設置點的那一個斷面。'],
  extra:()=>stats([['6,402 人','和平區假日超額訪客（112 年 11 月）'],['49.8%','假日訪客相對平日居民'],['61.7%','假日較平日午後旅次增加率'],['約 2,900 人','假日夜間淨流入，臺中市各區最高']])+
   `<figure><img src="img/fig3_day.jpg" alt="臺中市假日日間遊客密度 500 公尺方格圖" loading="lazy"><figcaption>臺中市假日日間遊客密度（500 m 方格，112 年 11 月）。假日日間活動人數減去平日夜間停留人數，以建築利用土地分派。資料來源：內政部電信信令人口統計資料、國土利用調查（2023）。</figcaption></figure>
    <figure><img src="img/fig4_night.jpg" alt="臺中市假日夜間遊客密度 500 公尺方格圖" loading="lazy"><figcaption>臺中市假日夜間遊客密度（500 m 方格，112 年 11 月），與上圖採相同分級。</figcaption></figure>`,
  method:'電信信令人口統計、分區密度推估（500 m 方格）、雙向人流計數器、時間序列分析',
  output:'區域訪客規模、步道使用強度與尖峰時段',

 {id:'vgi',zh:'VGI 數位足跡',en:'Digital Footprints',color:'#d9734e',t:[9,22],

 for(let i=0;i<7;i++){const a=i/7*Math.PI*2;person(c,Math.cos(a)*1.55,Math.sin(a)*1.55,['#c49a2c','#2f5d50','#3d7ea6','#b8743a','#7b62a8','#55606b','#4f8a3c'][i]);}
 [['#3d7ea6',-.4,.2],['#d9734e',.3,-.3],['#f2c94c',.1,.45]].forEach(([col,x,z])=>box(c,.32,.02,.32,col,x,.78,z));
 const wb=new THREE.Group();wb.position.set(0,0,-3.3);c.add(wb);box(wb,2,1.2,.08,'#fbfaf5',0,.8,0);box(wb,2.1,.08,.12,'#55606b',0,.75,0);box(wb,.06,.8,.06,'#55606b',-.9,0,0);box(wb,.06,.8,.06,'#55606b',.9,0,0);
 [['#c49a2c',-.6,1.6],['#3d7ea6',-.2,1.5],['#b8453a',.3,1.65],['#4f8a3c',.65,1.4]].forEach(([col,x,y])=>box(wb,.28,.28,.02,col,x,y-.14,.05));
 tree(c,-3.8,1,.9);tree(c,3.8,.6,.9);tree(c,3.2,3.3,.7,'round');lamp(c,-3,3);
};
B.decide=c=>{
 strip(c,-4.4,.8,4.4,.8,1,'#cdb894',.05);strip(c,.3,.8,2.2,-3.4,.8,'#cdb894',.05);
 const sp=new THREE.Group();sp.position.set(.4,0,1.9);c.add(sp);cyl(sp,.07,.07,2.2,'#6b4a32',0,0,0,6);
 [[0,1.9,'#2e6b8a',.3],[0,1.5,'#4f8a3c',-.6],[0,1.1,'#c49a2c',1.2]].forEach(([x,y,col,r])=>{const b=box(sp,1.2,.26,.08,col,.5,y,0);b.rotation.y=r;b.position.x=Math.cos(r)*.5;b.position.z=-Math.sin(r)*.5;});
 const gate=new THREE.Group();gate.position.set(1.8,0,-2.4);gate.rotation.y=-.42;c.add(gate);box(gate,.2,.9,.2,'#55606b',-.8,0,0);
 const bar=new THREE.Group();bar.position.set(-.8,.75,0);gate.add(bar);for(let i=0;i<5;i++)box(bar,.32,.12,.1,i%2?'#f4f1ea':'#c43a32',.16+i*.32,-.06,0);
 anim.push(t=>{bar.rotation.z=Math.max(0,Math.sin(t*.4))*1.1;});
 house(c,-2.3,-2,2.2,1.5,1.1,'#e8e1d0','#2e6b8a',.2);
 const db=new THREE.Group();db.position.set(-2.4,0,2.8);c.add(db);box(db,.12,.9,.12,'#3b3a36',0,0,0);box(db,1.5,.9,.12,'#1f2a33',0,.9,0);
 const L=[['#3ddc84',-.45],['#f2c94c',0],['#e2503c',.45]].map(([col,x])=>{const m=mesh(new THREE.SphereGeometry(.14,10,8),glow(col),x,1.35,.08,db);return m;});
 anim.push(t=>{const k=Math.floor(t/2.5)%3;L.forEach((m,i)=>m.material.emissiveIntensity=i===k?1.6:.15);});
 person(c,-1,.4,'#2e6b8a');person(c,1.6,1,'#b8743a');tree(c,3.8,2.8,.9);tree(c,-3.9,-.4,.8);tree(c,3.6,-.6,.7,'round');
};
B.gov=c=>{
 disc(c,2.6,'#d9d5c6',0,0,.04,6);
 const rings=[];for(let i=0;i<3;i++){cyl(c,.95,.95,.7,'#55606b',0,.1+i*.85,0,20);const r=mesh(new THREE.TorusGeometry(.97,.05,6,32),glow('#7fd1c7'),0,.8+i*.85,0,c);r.rotation.x=Math.PI/2;rings.push(r);}
 anim.push(t=>rings.forEach((r,i)=>{r.material.emissiveIntensity=.3+.9*Math.max(0,Math.sin(t*2.2-i*1.1));}));
 const bk=new THREE.Group();bk.position.set(-2.6,0,1.6);bk.rotation.y=.5;c.add(bk);box(bk,1.3,.12,1,'#2f5d50',0,0,0);const p1=box(bk,.62,.1,.92,'#fbfaf5',-.32,.14,0);p1.rotation.z=.12;const p2=box(bk,.62,.1,.92,'#fbfaf5',.32,.14,0);p2.rotation.z=-.12;
 house(c,2.4,-1.9,1.8,1.3,1,'#e8e1d0','#55606b',-.4);
 const sh=new THREE.Group();sh.position.set(2.6,0,2);c.add(sh);cyl(sh,.05,.05,.8,'#555',0,0,0,5);const sd=mesh(new THREE.CylinderGeometry(.42,.42,.08,6),'#2f5d50',0,1.1,0,sh);sd.rotation.x=Math.PI/2;
 person(c,-1.4,-2.2,'#55606b');lamp(c,-3.4,-1);tree(c,-3.8,-2.6,.8);tree(c,0,-3.8,.7);
};



/* ---- stations on clearings ---- */
const stations={},pick=[];
ST.forEach(s=>{const g=new THREE.Group();g.position.set(s.c.x,s.hc,s.c.z);scene.add(g);
 const cd=new THREE.Mesh(new THREE.CircleGeometry(5.4,40),new THREE.MeshStandardMaterial({color:'#a9c27f',roughness:1}));cd.rotation.x=-Math.PI/2;cd.position.y=.04;cd.receiveShadow=true;g.add(cd);
 const rim=new THREE.Mesh(new THREE.RingGeometry(5.2,5.45,40),new THREE.MeshBasicMaterial({color:s.color,transparent:true,opacity:.55}));rim.rotation.x=-Math.PI/2;rim.position.y=.06;g.add(rim);
 const c=new THREE.Group();c.position.y=.06;c.rotation.y=Math.atan2(s.tp.x-s.c.x,s.tp.z-s.c.z)+Math.PI;g.add(c);B[s.id](c);
 // spur path from trail to clearing
 const sp=new THREE.Group();scene.add(sp);const mid=s.c.clone().add(s.tp).multiplyScalar(.5);const L=s.c.distanceTo(s.tp);
 const spm=new THREE.Mesh(new THREE.BoxGeometry(1.2,.06,L),M('#c9b48a'));spm.position.set(mid.x,(s.hc+H(s.tp.x,s.tp.z))/2+.06,mid.z);spm.lookAt(s.tp.x,H(s.tp.x,s.tp.z)+.06,s.tp.z);spm.receiveShadow=true;sp.add(spm);
 g.userData.id=s.id;stations[s.id]={g,base:g.position.clone()};pick.push(g);});

/* ---- bridge over 大甲溪 ---- */
let bi=[];for(let i=0;i<=CS;i++){const p=cpts[i];if(hRaw(p.x,p.z)<WATER+.6)bi.push(i);}
if(bi.length){const a=cpts[Math.max(0,bi[0]-6)],b=cpts[Math.min(CS,bi[bi.length-1]+6)];const ya=Math.max(H(a.x,a.z),WATER+.3),yb=Math.max(H(b.x,b.z),WATER+.3);
 const p1=new THREE.Vector3(a.x,ya+.15,a.z),p2=new THREE.Vector3(b.x,yb+.15,b.z),L=p1.distanceTo(p2),g=new THREE.Group();g.position.copy(p1).add(p2).multiplyScalar(.5);g.position.y=Math.max(ya,yb,WATER+.9);scene.add(g);g.lookAt(p2.x,g.position.y,p2.z);
 box(g,1.9,.16,L,'#b08a5a',0,0,0);for(let k=0;k<Math.floor(L/.45);k++)box(g,1.92,.02,.06,'#8e6d45',0,.16,-L/2+.2+k*.45);
 [-.9,.9].forEach(x=>{box(g,.06,.06,L,'#7a5b3e',x,.85,0);for(let k=0;k<=Math.round(L/1.2);k++)box(g,.08,.85,.08,'#6b4a32',x,0,-L/2+k*L/Math.round(L/1.2));});
 [-L/2,L/2].forEach(zz=>[-.9,.9].forEach(x=>cyl(g,.14,.18,3,'#6b4a32',x,-2.6,zz,6)));}

/* ---- forest (instanced) ---- */
const trailSamp=cpts.filter((_,i)=>i%3===0);
function okTree(x,z,h){if(h<WATER+.7)return false;if(Math.abs(z-rz(x))<4.2&&Math.hypot(x,z)<140)return false;
 for(const s of ST)if(Math.hypot(x-s.c.x,z-s.c.z)<6.6)return false;
 for(const p of trailSamp)if(Math.abs(p.x-x)<3.2&&Math.abs(p.z-z)<3.2&&Math.hypot(p.x-x,p.z-z)<3)return false;
 for(const s of ST){const dx=x-(s.c.x+s.tp.x)/2,dz=z-(s.c.z+s.tp.z)/2;if(Math.hypot(dx,dz)<2.4)return false;}return true;}
const NT=4200,trunkG=new THREE.CylinderGeometry(.1,.14,.7,5);trunkG.translate(0,.35,0);
const fA=new THREE.ConeGeometry(.85,1.7,6);fA.translate(0,1.25,0);const fB=new THREE.ConeGeometry(.6,1.3,6);fB.translate(0,2.05,0);
const rG=new THREE.IcosahedronGeometry(.85,0);rG.translate(0,1.35,0);
const iTr=new THREE.InstancedMesh(trunkG,M('#5e4632'),NT),iA=new THREE.InstancedMesh(fA,new THREE.MeshStandardMaterial({roughness:.95,flatShading:true}),NT),iB=new THREE.InstancedMesh(fB,new THREE.MeshStandardMaterial({roughness:.95,flatShading:true}),NT),iR=new THREE.InstancedMesh(rG,new THREE.MeshStandardMaterial({roughness:.95,flatShading:true}),NT);
const pineC=['#3b5e40','#43683f','#355a3e','#4a6f45'],broadC=['#5f8148','#6c8c4e','#7a9656','#55783f'],dm=new THREE.Object3D(),col=new THREE.Color();
let np=0,nr=0,tries=0;
while((np+nr)<NT&&tries<40000){tries++;const r=Math.sqrt(rnd())*140,a=rnd()*Math.PI*2,x=Math.cos(a)*r,z=Math.sin(a)*r;const h=H(x,z);if(!okTree(x,z,h))continue;if(h>30&&rnd()<.7)continue;
 const s=.8+rnd()*.9+(h>12?.2:0);dm.position.set(x,h-.05,z);dm.rotation.set((rnd()-.5)*.08,rnd()*6.28,(rnd()-.5)*.08);dm.scale.set(s,s*(.9+rnd()*.4),s);dm.updateMatrix();
 const pine=h>6?rnd()<.8:rnd()<.45;
 if(pine){iTr.setMatrixAt(np+nr,dm.matrix);iA.setMatrixAt(np,dm.matrix);iB.setMatrixAt(np,dm.matrix);col.set(pineC[Math.floor(rnd()*4)]);iA.setColorAt(np,col);col.offsetHSL(0,0,.04);iB.setColorAt(np,col);np++;}
 else{iTr.setMatrixAt(np+nr,dm.matrix);iR.setMatrixAt(nr,dm.matrix);col.set(broadC[Math.floor(rnd()*4)]);iR.setColorAt(nr,col);nr++;}}
iTr.count=np+nr;iA.count=iB.count=np;iR.count=nr;
[iTr,iA,iB,iR].forEach(m=>{m.castShadow=true;m.receiveShadow=true;m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true;scene.add(m);});
// reorder trunk matrices: trunks were set at (np+nr) index sequentially — fine.

/* ---- pulse along trail ---- */
const N=80,dots=new THREE.InstancedMesh(new THREE.SphereGeometry(.2,10,8),new THREE.MeshBasicMaterial({color:'#ffd27a'}),N);scene.add(dots);
const off=[...Array(N)].map(()=>rnd()),dv=new THREE.Object3D();
anim.push(t=>{for(let i=0;i<N;i++){const k=(off[i]+t*.006*(.6+off[(i+7)%N]*.8))%1;const idx=Math.floor(k*CS);const p=cpts[idx];dv.position.set(p.x,trailY[idx]+.45+Math.sin(t*3+i)*.05,p.z);dv.scale.setScalar(.75+.45*Math.max(0,Math.sin(t*2.2-k*60)));dv.updateMatrix();dots.setMatrixAt(i,dv.matrix);}dots.instanceMatrix.needsUpdate=true;});

/* ---- labels ---- */
const labs={},pks=[];
ST.forEach(s=>{const d=document.createElement('div');d.className='lab';d.innerHTML=`<span class="n" style="background:${s.color}">${s.no}</span>${s.zh}<span class="ok"></span>`;d.onclick=()=>{stopTour();select(s.id);};$('labels').appendChild(d);labs[s.id]=d;});
PEAKS.forEach(p=>{const d=document.createElement('div');d.className='pk';d.innerHTML=`▲ ${p.n}<small>${p.e.toLocaleString()} m</small>`;$('labels').appendChild(d);pks.push({d,v:new THREE.Vector3(p.x,hRaw(p.x,p.z)+2.5,p.z)});});
{const d=document.createElement('div');d.className='pk';d.innerHTML='大甲溪';$('labels').appendChild(d);pks.push({d,v:new THREE.Vector3(-70,WATER+1,rz(-70))});}
const ring=new THREE.Mesh(new THREE.RingGeometry(5.5,6.1,48),new THREE.MeshBasicMaterial({color:'#f2c879',transparent:true,opacity:.95}));ring.rotation.x=-Math.PI/2;ring.visible=false;scene.add(ring);
hooks.push(()=>{const st=selected?BY[selected].step:null;ST.forEach(s=>{labs[s.id].classList.toggle('sel',s.id===selected);labs[s.id].classList.toggle('dim',!!st&&!st.ids.includes(s.id));labs[s.id].querySelector('.ok').textContent=visited.has(s.id)?'✓':'';});
 ring.visible=!!selected;if(selected){const b=stations[selected].base;ring.position.set(b.x,b.y+.09,b.z);}});
sync();

/* ---- picking ---- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let down=null,hover=null,mv=null;
function pk(x,y){const r=canvas.getBoundingClientRect();ndc.set((x-r.left)/r.width*2-1,-(y-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);
 for(const h of ray.intersectObjects(pick,true)){let o=h.object;while(o&&!o.userData.id)o=o.parent;if(o)return o.userData.id;}return null;}
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};fly=null;stopTour();canvas.style.cursor='grabbing';});
canvas.addEventListener('pointerup',e=>{canvas.style.cursor=hover?'pointer':'grab';if(!down)return;if(Math.hypot(e.clientX-down.x,e.clientY-down.y)<6){const id=pk(e.clientX,e.clientY);if(id)select(id);}down=null;});
canvas.addEventListener('pointermove',e=>{mv=e;});
canvas.addEventListener('wheel',()=>{fly=null;stopTour();},{passive:true});

/* ---- camera ---- */
let fly=null;const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const flyRaw=(toT,toP,dur=1.5)=>{fly={t:0,dur,fT:controls.target.clone(),fP:camera.position.clone(),toT,toP};};
function flyTo(id){const p=stations[id].base.clone();p.y+=1;const sp=new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));sp.phi=THREE.MathUtils.clamp(sp.phi,.7,.98);sp.radius=26;flyRaw(p,p.clone().add(new THREE.Vector3().setFromSpherical(sp)));}
const home=()=>flyRaw(HOME_T.clone(),HOME_P.clone(),1.7);
function zoom(f){const o=camera.position.clone().sub(controls.target);const L=THREE.MathUtils.clamp(o.length()*f,controls.minDistance,controls.maxDistance);flyRaw(controls.target.clone(),controls.target.clone().add(o.setLength(L)),.5);}

/* ---- day/night ---- */
const D={bg:new THREE.Color('#cfdcd2'),sky:new THREE.Color('#ffffff'),gnd:new THREE.Color('#6f8466'),h:1,sc:new THREE.Color('#fff1d6'),s:2.2,w:new THREE.Color('#5f9fae')};
const Nn={bg:new THREE.Color('#121c1a'),sky:new THREE.Color('#5d7396'),gnd:new THREE.Color('#202a26'),h:.3,sc:new THREE.Color('#9fb5d9'),s:.42,w:new THREE.Color('#1f3a44')};
let nt=0;
function applyN(k){scene.background.copy(D.bg).lerp(Nn.bg,k);scene.fog.color.copy(scene.background);stage.style.background='#'+scene.background.getHexString();
 hemi.color.copy(D.sky).lerp(Nn.sky,k);hemi.groundColor.copy(D.gnd).lerp(Nn.gnd,k);hemi.intensity=THREE.MathUtils.lerp(D.h,Nn.h,k);sun.color.copy(D.sc).lerp(Nn.sc,k);sun.intensity=THREE.MathUtils.lerp(D.s,Nn.s,k);
 waterMat.color.copy(D.w).lerp(Nn.w,k);winMat.emissiveIntensity=k*1.7;lampMat.emissiveIntensity=k*2.4;}
applyN(0);

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();
const clock=new THREE.Clock(),v=new THREE.Vector3();
(function loop(){
 const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 if(mv){hover=pk(mv.clientX,mv.clientY);if(!down)canvas.style.cursor=hover?'pointer':'grab';mv=null;}
 if(fly){fly.t+=dt/fly.dur;const e=ease(Math.min(1,fly.t));controls.target.lerpVectors(fly.fT,fly.toT,e);camera.position.lerpVectors(fly.fP,fly.toP,e);if(fly.t>=1)fly=null;}
 controls.update();
 const tg2=night?1:0;if(Math.abs(nt-tg2)>.001){nt+=(tg2-nt)*Math.min(1,dt*3);applyN(nt);}
 anim.forEach(f=>f(t,dt));
 const w=stage.clientWidth,h=stage.clientHeight;
 for(const id in labs){const b=stations[id].base;v.set(b.x,b.y+5.2,b.z).project(camera);const el=labs[id];
  if(v.z>1){el.style.visibility='hidden';continue;}el.style.visibility='';el.style.transform=`translate(${((v.x+1)/2*w).toFixed(1)}px,${((1-v.y)/2*h).toFixed(1)}px) translate(-50%,-100%)`;}
 for(const p of pks){v.copy(p.v).project(camera);if(v.z>1){p.d.style.visibility='hidden';continue;}p.d.style.visibility='';p.d.style.transform=`translate(${((v.x+1)/2*w).toFixed(1)}px,${((1-v.y)/2*h).toFixed(1)}px) translate(-50%,-100%)`;}
 renderer.render(scene,camera);requestAnimationFrame(loop);
})();
return {flyTo,home,zoom,setPulse:on=>{dots.visible=on;}};
}
