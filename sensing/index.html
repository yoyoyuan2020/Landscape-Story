<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>林野感測站｜森林遊憩新世代感測技術平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f3ec;--card:#fffdf8;--ink:#1f2723;--muted:#5f6a63;--green:#2f5d50;--green2:#e3ece6;--accent:#b8743a;--line:#e0dccf;--warn:#9a3b2f}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:var(--green)}
header.top{position:sticky;top:0;z-index:10;background:rgba(245,243,236,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:12px 22px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo b{font-family:'Noto Serif TC',serif;font-size:20px;color:var(--green)}
.logo small{font-size:12px;color:var(--muted);display:block;line-height:1.3}
nav.main{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
nav.main a{text-decoration:none;color:var(--ink);font-size:14.5px;font-weight:500;padding:7px 12px;border-radius:999px}
nav.main a.on,nav.main a:hover{background:var(--green);color:#fff}
main{max-width:1120px;margin:0 auto;padding:30px 22px 70px}
h1,h2,h3{font-family:'Noto Serif TC',serif;line-height:1.35}
h1{font-size:36px;margin:8px 0 12px;color:var(--green)}
h2{font-size:26px;margin:40px 0 12px}
h3{font-size:19px;margin:0 0 6px}
.eyebrow{font-size:12px;letter-spacing:.22em;font-weight:700;color:var(--accent)}
.lead{font-size:17px;color:#3a443e;max-width:760px}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:34px;align-items:center;padding:20px 0 10px}
.hero .box{background:var(--green);color:#eef4ef;border-radius:20px;padding:24px 26px}
.hero .box h3{color:#fff}
.hero .box ol{margin:8px 0 0;padding-left:20px;font-size:14.5px}
.doors{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}
.door{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s}
.door:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(30,50,40,.1)}
.door b{display:block;font-size:17px;color:var(--green);margin-bottom:4px}
.door span{font-size:13.5px;color:var(--muted);line-height:1.6;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-decoration:none;color:var(--ink);display:flex;gap:14px;align-items:flex-start;transition:box-shadow .15s}
.tcard:hover{box-shadow:0 8px 22px rgba(30,50,40,.1)}
.ico{flex:none;width:46px;height:46px;border-radius:12px;background:var(--green2);display:flex;align-items:center;justify-content:center}
.ico svg{width:28px;height:28px;stroke:var(--green);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tcard b{display:block;font-size:16px;line-height:1.4}
.tcard span{font-size:13px;color:var(--muted);line-height:1.55;display:block;margin-top:3px}
.votes{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--green2);color:var(--green);text-decoration:none;font-weight:500}
.chip.alt{background:#f3e6d8;color:#8a5426}
.prob{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.prob .head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.prob .n{font-size:13px;color:var(--accent);font-weight:700;white-space:nowrap}
.prob p{margin:6px 0 4px;font-size:14.5px;color:#3a443e}
.meter{height:6px;background:#ebe7da;border-radius:3px;margin:8px 0 2px;overflow:hidden}.meter i{display:block;height:100%;background:var(--accent)}
.detail{display:grid;grid-template-columns:1fr 300px;gap:30px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 22px;margin-bottom:14px}
.sec h4{margin:0 0 6px;font-size:14px;letter-spacing:.08em;color:var(--green)}
.sec.no h4{color:var(--warn)}
.sec ul{margin:0;padding-left:20px}.sec li{margin:3px 0}
.side .sec{position:sticky;top:80px}
.side dl{margin:0;font-size:14px}.side dt{color:var(--muted);font-size:12.5px;margin-top:10px}.side dd{margin:2px 0 0}
.back{display:inline-block;margin-bottom:10px;font-size:14px;text-decoration:none;color:var(--muted)}
.case{display:grid;grid-template-columns:1fr 1.1fr;gap:24px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;align-items:center}
.case img{width:100%;border-radius:12px;border:1px solid var(--line);display:block;background:#fff}
.btn{display:inline-block;background:var(--green);color:#fff;text-decoration:none;font-weight:700;padding:10px 18px;border-radius:999px;font-size:14.5px;margin-top:8px}
.btn.ghost{background:none;color:var(--green);border:1.5px solid var(--green)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.stat{background:var(--green2);border-radius:12px;padding:12px 14px}.stat b{display:block;font-family:'Noto Serif TC',serif;font-size:22px;color:var(--green)}.stat span{font-size:12px;color:var(--muted);line-height:1.5}
.ws{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:14px;display:grid;grid-template-columns:90px 1fr;gap:16px}
.ws .no{font-family:'Noto Serif TC',serif;font-size:34px;color:var(--accent);line-height:1}
.ws dl{display:grid;grid-template-columns:86px 1fr;gap:4px 10px;margin:8px 0 0;font-size:14px}.ws dt{color:var(--muted)}.ws dd{margin:0}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:#f3e6d8;color:#8a5426;margin-left:6px;vertical-align:middle}
.note{font-size:13px;color:var(--muted);line-height:1.8}
.callout{background:#f3e6d8;border-radius:14px;padding:14px 18px;font-size:14.5px;margin:14px 0}
footer{border-top:1px solid var(--line);padding:24px 22px 40px;text-align:center;font-size:13px;color:var(--muted)}
table.mx{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--card);border-radius:12px;overflow:hidden}
table.mx th,table.mx td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.mx th{background:var(--green2);font-weight:700}
@media(max-width:860px){.hero,.detail,.case{grid-template-columns:1fr}.doors{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}h1{font-size:28px}.side .sec{position:static}.bar{flex-wrap:wrap}nav.main{margin-left:0}.ws{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="bar">
 <a class="logo" href="#home"><svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="#2f5d50"/><path d="M9 24l5-9 3 5 3-6 5 10z" fill="#f2c879"/><circle cx="24" cy="10" r="2.2" fill="#fff"/></svg><div><b>林野感測站</b><small>森林遊憩新世代感測技術平台（暫名）</small></div></a>
 <nav class="main" id="nav">
  <a href="#problems" data-r="problems">依管理問題找</a>
  <a href="#tech" data-r="tech">技術圖鑑</a>
  <a href="#cases" data-r="cases">應用實例</a>
  <a href="#workshops" data-r="workshops">工作坊</a>
  <a href="#about" data-r="about">關於</a>
 </nav>
</div></header>
<main id="view"></main>
<footer>林野感測站（暫名）・東海大學 LaViSa Lab 原友蘭 製作<br>內容彙整自「森林步道新世代監測模式建置」相關研究與工作坊成果；技術說明為一般性介紹，實際導入請依場域條件評估。</footer>

<script>
/* ===== icons ===== */
const I={
 counter:'<path d="M6 4v16M18 4v16"/><path d="M9 12h6M12 9l3 3-3 3"/>',
 telecom:'<path d="M12 20V9"/><path d="M8 6a6 6 0 0 1 8 0M5.5 3.5a10 10 0 0 1 13 0"/><circle cx="12" cy="9" r="1.5"/><path d="M8 20h8"/>',
 social:'<rect x="4" y="6" width="16" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M8 6l1.5-2h5L16 6"/>',
 citizen:'<path d="M4 15c2-4 6-6 10-5l4-3-1 5c0 3-3 6-7 6H6z"/><circle cx="14.5" cy="11" r=".8"/>',
 gpx:'<path d="M5 19c2-6 4 0 7-6s5-2 7-8"/><circle cx="5" cy="19" r="1.6"/><circle cx="19" cy="5" r="1.6"/>',
 image:'<rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3"/>',
 traffic:'<rect x="5" y="9" width="14" height="7" rx="2"/><path d="M7 9l2-4h6l2 4"/><circle cx="8.5" cy="17.5" r="1.5"/><circle cx="15.5" cy="17.5" r="1.5"/>',
 env:'<path d="M12 3v11"/><circle cx="12" cy="17" r="3"/><path d="M15 6h3M15 9h2"/>',
 qr:'<rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 20h2M20 14v2"/>',
 rescue:'<path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><path d="M12 7v6M9 10h6"/>',
 booking:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9h16M8 3v4M16 3v4M8 13h3"/>',
 drone:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8 8l2.5 2.5M16 8l-2.5 2.5"/><rect x="10" y="10" width="4" height="4" rx="1"/><path d="M12 14v4M10 20h4"/>'
};
const ico=(k)=>`<div class="ico"><svg viewBox="0 0 24 24">${I[k]}</svg></div>`;

/* ===== technologies (12 types from the World Café poster) ===== */
const T=[
 {id:'gpx',name:'登山 APP 與 GPS／GPX 軌跡',v:8,one:'山友手機或手錶記錄下的行走路線，可回答人走了哪裡、停在哪裡。',
  can:['熱門路線與路段使用強度','停留點與休息點的位置','偏離正式步道、形成非正式路徑的位置','迷途或折返的熱點','實際行進時間，可用來檢討步道標示的建議時間'],
  cant:['全體遊客的人數（只代表有記錄的人）','沒有開啟 APP 的遊客行為'],
  bias:'記錄軌跡的多是較有經驗的山友，輕裝散步型遊客偏少；熱門 APP 的使用者族群也會影響結果。',
  cost:'可下載公開軌跡或與平台合作取得；需要 GIS 處理能力，把大量軌跡轉成路段使用量。',
  privacy:'軌跡的起訖點可能指向個人住家，使用時需截斷起訖段，並確認授權或使用者同意。',
  clue:'工作坊 12 類資料中貼點最多（8 點）。管理者最想知道的是「人進去之後去了哪裡」。',
  pair:['counter','drone','rescue'],probs:['offtrail','lost','signal']},
 {id:'qr',name:'QR Code 回報與線上參與',v:7,one:'在現場貼上 QR Code，讓遊客或巡查人員隨手回報設施損壞、意見或狀況。',
  can:['設施損壞、步道劣化的即時回報','遊客意見與滿意度','特定活動或解說的參與紀錄'],
  cant:['「沒有回報」不代表「沒有問題」','回報者以外的遊客感受'],
  bias:'願意掃碼的人是特定族群；長者或不熟悉手機的人較少回報；需要網路訊號。',
  cost:'建置成本低，真正的成本在後端：誰受理、多久處理、如何回覆。',
  privacy:'若蒐集聯絡方式需告知用途；回報照片可能拍到他人。',
  clue:'工作坊貼點第二高（7 點）。C 桌提醒：設置回報入口只是起點，必須搭配受理、確認、警示與維修的流程。',
  pair:['citizen','image'],probs:['facility','feeding']},
 {id:'image',name:'影像與 AI 辨識',v:5,one:'以攝影機搭配影像辨識，自動計算人數、車輛或辨識特定行為。',
  can:['入口或觀景點的即時人數與擁擠程度','特定行為，例如餵食、犬隻未繫繩、進入封閉區','車流與停車狀況'],
  cant:['鏡頭範圍以外的區域','夜間、霧天或遮蔽時的準確度'],
  bias:'鏡頭位置與角度決定能看到什麼；不同場景需要重新設定或訓練辨識模型。',
  cost:'設備、電力、網路與後端運算都需要；工作坊提到，鏡頭位置不同會增加辨識設定與影像處理的工作量。',
  privacy:'會拍到人臉與車牌，需要明確告示、遮蔽處理與保存期限規範。',
  clue:'工作坊貼點 5 點。最高痛點「餵食野生動物」目前沒有對應工具，影像是少數可能直接看見行為的方法。',
  pair:['counter','traffic'],probs:['feeding','closure','crowd']},
 {id:'traffic',name:'停車與交通感測',v:5,one:'以地磁、車牌辨識或既有交通攝影機，掌握停車場與聯外道路的車流。',
  can:['停車場使用率與到離時間','聯外道路的壅塞前兆','尖峰時段預測，提早引導或管制'],
  cant:['步行遊客的實際人數（每車人數不固定）'],
  bias:'機車、遊覽車與接駁車的處理方式會影響結果。',
  cost:'可先盤點公路單位、地方政府既有的交通感測資源，再評估是否需要自建；工作坊建議把觀測範圍延伸到入園前的道路。',
  privacy:'車牌辨識屬個人資料，需限定用途與保存期限。',
  clue:'工作坊貼點 5 點；「設施／停車使用率預測」也是 15 位與會者中 8 位想要的情境。',
  pair:['counter','telecom','booking'],probs:['crowd','leave']},
 {id:'telecom',name:'電信或行動裝置群聚資料',v:4,one:'由手機與基地台的連線紀錄推估各區域的人口與流動，政府已有開放的彙總資料。',
  can:['鄉鎮或方格尺度的假日訪客規模','日間與夜間、平日與假日的差異','跨年度比較，作為區域基線'],
  cant:['人走進了哪一條步道','基地台稀疏的山區，細部空間精度有限'],
  bias:'受基地台涵蓋範圍、業者用戶組成，以及未持手機者如何推估等因素影響；以行政區面積計算密度會嚴重稀釋山區（可變面積單元問題）。',
  cost:'內政部提供鄉鎮尺度的月資料，可免費取得；更細的時間與空間尺度需向業者購買，購買前應先確定要回答的問題與範圍。',
  privacy:'開放資料已匿名彙總，個資風險低。',
  clue:'工作坊貼點 4 點。本平台的應用實例「電信信令看臺中假日遊客」即示範如何把鄉鎮資料分派到 500 公尺方格。',
  pair:['counter','social'],probs:['crowd','signal']},
 {id:'social',name:'社群媒體定位、照片與文字',v:3,one:'遊客公開分享的打卡、照片與評論，是遊憩活動留下的數位足跡。',
  can:['熱門景點與拍照點','遊客關注什麼、對目的地的想像（意象）','爆量前兆，例如楓紅或花季的社群熱度'],
  cant:['實際遊客人數','不分享的遊客行為'],
  bias:'願意打卡與上傳的人本身就是特定樣本，少數高頻使用者可能貢獻大量紀錄；在人數少的山區，資料常常過於稀疏。',
  cost:'需要技術取得與整理；平台政策變動可能讓資料來源中斷。',
  privacy:'即使是公開資料，使用時也應去識別化，不呈現個別使用者。',
  clue:'工作坊貼點 3 點；A 桌案例指出，社群分享曾讓大坑步道與稍來山楓紅人潮暴增。',
  pair:['counter','citizen'],probs:['crowd']},
 {id:'env',name:'氣象與環境感測器',v:3,one:'雨量、溫濕度、風速與土壤含水等感測器，協助判斷步道與遊客的環境風險。',
  can:['降雨與步道封閉、開放的決策依據','步道沖蝕與崩塌的風險時段','遊客準備不足（天候變化）的預警資訊'],
  cant:['遊客實際的行為反應'],
  bias:'山區測站少，地形差異大，單一測站難以代表整條步道。',
  cost:'設備與維護、電力與資料回傳；可先整合氣象署與既有測站。',
  privacy:'不涉個人資料。',
  clue:'工作坊貼點 3 點；與會者提到山區測站稀少，影響現場判斷。',
  pair:['rescue','drone'],probs:['weather','closure']},
 {id:'rescue',name:'救援、報案與事件位置',v:3,one:'把事故、報案與救援的發生地點整理成圖，找出高風險路段。',
  can:['事故熱點與高風險路段','岔路、迷途與失聯的好發位置','推估山區無訊號區域'],
  cant:['沒有通報的事件與差點發生的狀況'],
  bias:'只記錄已發生且有通報的事件，件數少時不宜過度解讀。',
  cost:'需要跨單位（消防、警政、管理單位）整合紀錄格式。',
  privacy:'個案資料敏感，對外只呈現彙總結果。',
  clue:'工作坊貼點 3 點；「山區無訊號」有 7 位與會者標記，搜救時待救者擅自下切失聯即是一例。',
  pair:['gpx','env'],probs:['signal','lost']},
 {id:'counter',name:'自動人流計數器',v:2,one:'裝在登山口或步道上的感測器，記錄通過的人次與方向。',
  can:['某個斷面每小時、每日的進出人次','假日與連假尖峰','上下山差額，推估仍在山上的人數（颱風、日落前清山）','封閉期間仍有人通過的證據'],
  cant:['人進去後走到哪裡、停多久','結伴並行時可能少算'],
  bias:'安裝位置決定一切；需要定期以人工計數校正。',
