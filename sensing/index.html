<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>林野感測站｜森林遊憩新世代感測技術學習平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f3ec;--card:#fffdf8;--ink:#1f2723;--muted:#5f6a63;--green:#2f5d50;--green2:#e3ece6;--accent:#b8743a;--acc2:#f3e6d8;--blue:#2e6b8a;--blue2:#e1edf3;--line:#e0dccf;--warn:#9a3b2f}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:var(--green)}
header.top{position:sticky;top:0;z-index:10;background:rgba(245,243,236,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar{max-width:1160px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:12px 22px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo b{font-family:'Noto Serif TC',serif;font-size:20px;color:var(--green)}
.logo small{font-size:12px;color:var(--muted);display:block;line-height:1.3}
nav.main{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
nav.main a{text-decoration:none;color:var(--ink);font-size:14.5px;font-weight:500;padding:7px 12px;border-radius:999px}
nav.main a.on,nav.main a:hover{background:var(--green);color:#fff}
main{max-width:1160px;margin:0 auto;padding:30px 22px 70px}
h1,h2,h3{font-family:'Noto Serif TC',serif;line-height:1.35}
h1{font-size:34px;margin:8px 0 12px;color:var(--green)}
h2{font-size:25px;margin:38px 0 10px}
h3{font-size:18px;margin:0 0 4px}
.eyebrow{font-size:12px;letter-spacing:.22em;font-weight:700;color:var(--accent)}
.lead{font-size:17px;color:#3a443e;max-width:800px}
.note{font-size:13px;color:var(--muted);line-height:1.8}
.btn{display:inline-block;background:var(--green);color:#fff;text-decoration:none;font-weight:700;padding:10px 18px;border-radius:999px;font-size:14.5px;margin-top:8px;border:0;cursor:pointer}
.btn.ghost{background:none;color:var(--green);border:1.5px solid var(--green)}
/* path */
.path{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:26px 0}
.step{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 20px 18px;text-decoration:none;color:var(--ink);position:relative;transition:transform .15s,box-shadow .15s}
.step:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(30,50,40,.12)}
.step .k{display:inline-flex;width:44px;height:44px;border-radius:12px;align-items:center;justify-content:center;font-family:'Noto Serif TC';font-weight:900;font-size:22px;color:#fff;margin-bottom:8px}
.step b{display:block;font-size:18px}.step span{display:block;font-size:14px;color:var(--muted);line-height:1.65;margin-top:4px}
.step em{display:block;font-style:normal;font-size:13px;color:var(--accent);font-weight:700;margin-top:10px}
.step:not(:last-child)::after{content:'→';position:absolute;right:-14px;top:42%;font-size:20px;color:var(--accent);z-index:2}
.qs{background:var(--green);color:#eef4ef;border-radius:18px;padding:20px 24px;margin:12px 0 26px}
.qs h3{color:#fff;margin-bottom:6px}.qs ol{margin:0;padding-left:20px}.qs li{margin:2px 0}
.ask{background:var(--acc2);border-radius:16px;padding:16px 20px;margin:14px 0 22px}
.ask h4{margin:0 0 6px;font-size:14px;color:#8a5426;letter-spacing:.06em}
.ask ol{margin:0;padding-left:20px;font-size:14.5px}
.avoid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.avoid div{border-radius:14px;padding:14px 16px;font-size:14px}
.avoid .x{background:#f6e3df}.avoid .o{background:var(--green2)}
.avoid b{display:block;margin-bottom:4px}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:inherit;transition:box-shadow .15s,transform .15s;width:100%}
.card:hover{box-shadow:0 8px 22px rgba(30,50,40,.12);transform:translateY(-1px)}
.ico{flex:none;width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative}
.ico svg{width:28px;height:28px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico i{position:absolute;right:-6px;bottom:-6px;font-style:normal;font-size:11px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:6px;padding:0 5px;line-height:18px}
.a .ico{background:var(--acc2)}.a .ico svg{stroke:#8a5426}
.b .ico{background:var(--blue2)}.b .ico svg{stroke:var(--blue)}
.c .ico{background:var(--green2)}.c .ico svg{stroke:var(--green)}
.card b{display:block;font-size:15.5px;line-height:1.45}
.card span{font-size:12.8px;color:var(--muted);line-height:1.55;display:block;margin-top:3px}
.card .more{font-size:12px;color:var(--accent);font-weight:700;margin-top:6px;display:block}
.group{margin:24px 0 8px;font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,28,25,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:40px 16px}
.modal.show{display:flex}
.sheet{background:var(--paper);border-radius:20px;max-width:780px;width:100%;padding:28px 30px 26px;position:relative;box-shadow:0 30px 70px rgba(0,0,0,.3)}
.close{position:absolute;right:16px;top:14px;border:0;background:var(--card);width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;color:var(--muted)}
.mh{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.mh .ico{width:58px;height:58px}.mh .ico svg{width:34px;height:34px}
.mh h2{margin:0;font-size:24px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-top:12px}
.sec h4{margin:0 0 4px;font-size:13.5px;letter-spacing:.06em;color:var(--green)}
.sec.no h4{color:var(--warn)}
.sec ul,.sec ol{margin:0;padding-left:20px}.sec li{margin:2px 0}.sec p{margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two .sec{margin-top:12px}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lk{font-size:12.5px;padding:4px 10px;border-radius:999px;text-decoration:none;font-weight:500;border:0;cursor:pointer;font-family:inherit}
.lk.a{background:var(--acc2);color:#8a5426}.lk.b{background:var(--blue2);color:var(--blue)}.lk.c{background:var(--green2);color:var(--green)}
.case{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:12px;padding:12px 16px;margin-top:10px}
.case .ref{font-size:13px;color:var(--muted);line-height:1.6}
.case p{margin:4px 0 0;font-size:14.5px}
.case a{font-size:12.5px;font-weight:700}
.mnav{display:flex;justify-content:space-between;margin-top:18px}
.mnav button{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit;font-size:14px}
/* cases page */
.cbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:12px;display:grid;grid-template-columns:52px 1fr;gap:14px}
.cbox .ico{background:var(--green2)}.cbox .ico svg{stroke:var(--green)}
.cbox .ref{font-size:13.5px;color:var(--muted)}
.cbox p{margin:4px 0}
.ws{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:14px;display:grid;grid-template-columns:80px 1fr;gap:16px}
.ws .no{font-family:'Noto Serif TC',serif;font-size:34px;color:var(--accent);line-height:1}
.ws dl{display:grid;grid-template-columns:86px 1fr;gap:4px 10px;margin:8px 0 0;font-size:14px}.ws dt{color:var(--muted)}.ws dd{margin:0}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--acc2);color:#8a5426;margin-left:6px;vertical-align:middle}
footer{border-top:1px solid var(--line);padding:24px 22px 40px;text-align:center;font-size:13px;color:var(--muted)}
@media(max-width:860px){.path,.avoid,.two{grid-template-columns:1fr}.step:not(:last-child)::after{content:'↓';right:50%;top:auto;bottom:-22px}h1{font-size:27px}.bar{flex-wrap:wrap}nav.main{margin-left:0}.ws{grid-template-columns:1fr}.sheet{padding:24px 18px}.modal{padding:16px 8px}}
</style>
</head>
<body>
<header class="top"><div class="bar">
 <a class="logo" href="#home"><svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="#2f5d50"/><path d="M9 24l5-9 3 5 3-6 5 10z" fill="#f2c879"/><circle cx="24" cy="10" r="2.2" fill="#fff"/></svg><div><b>林野感測站</b><small>森林遊憩新世代感測技術學習平台（暫名）</small></div></a>

  <a href="#home" data-r="home">學習路徑</a>

  <a href="#about" data-r="about">關於</a>

<script>
/* ===================== icons ===================== */
const SV={
 /* A categories */
 behavior:'<circle cx="12" cy="5" r="2"/><path d="M12 7v6l-3 7M12 13l3 7M8 10h8"/>',
 realtime:'<circle cx="12" cy="13" r="7"/><path d="M12 9v4l3 2M9 3h6"/>',
 facility:'<path d="M4 20V10l8-6 8 6v10z"/><path d="M10 20v-5h4v5"/>',
 data:'<ellipse cx="12" cy="6" rx="7" ry="2.5"/><path d="M5 6v12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V6M5 12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/>',
 surge:'<path d="M3 17l5-5 4 3 8-9"/><path d="M15 6h5v5"/>',
 eco:'<path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14z"/><path d="M5 19l8-8"/>',
 other:'<circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/>',
 /* B scenarios */
 bA:'<path d="M4 18l5-12 4 8 3-4 4 8z"/><circle cx="17" cy="6" r="1.6"/>',
 bB:'<circle cx="7" cy="8" r="2"/><circle cx="16" cy="7" r="2"/><circle cx="11" cy="16" r="2"/><path d="M8.5 9.5l1.7 4.6M14.6 8.3l-2.6 6"/>',
 bC:'<rect x="4" y="5" width="16" height="12" rx="2"/><path d="M8 17l-2 3M8 10h8M8 13h5"/>',
 bD:'<path d="M12 3l2.6 5.5 6 .8-4.4 4.2 1.1 6L12 16.7 6.7 19.5l1.1-6L3.4 9.3l6-.8z"/>',
 bE:'<path d="M4 20V4M4 20h16"/><path d="M7 15l4-4 3 3 5-6"/>',
 bF:'<rect x="5" y="4" width="14" height="16" rx="2"/><path d="M10 16V8h3a2.5 2.5 0 0 1 0 5h-3"/>',
 bG:'<path d="M12 3v18M8 3l-4 18M16 3l4 18"/><path d="M12 7v2M12 12v2"/>',
 bH:'<path d="M4 6h12v8H8l-4 4z"/><path d="M18 10h2v8l-3-3h-5"/>',
 bI:'<path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><path d="M12 7v6M9 10h6"/>',
 bJ:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>',
 bK:'<path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14z"/><circle cx="10" cy="14" r="1"/>',
 bL:'<path d="M14 6l4 4-9 9H5v-4z"/><path d="M12 8l4 4"/>',
 /* C data */
 cA:'<path d="M6 4v16M18 4v16"/><path d="M9 12h6M12 9l3 3-3 3"/>',
 cB:'<rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3"/>',
 cC:'<rect x="5" y="9" width="14" height="7" rx="2"/><path d="M7 9l2-4h6l2 4"/><circle cx="8.5" cy="17.5" r="1.5"/><circle cx="15.5" cy="17.5" r="1.5"/>',
 cD:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9h16M8 3v4M16 3v4M8 13h3"/>',
 cE:'<path d="M12 20V9"/><path d="M8 6a6 6 0 0 1 8 0M5.5 3.5a10 10 0 0 1 13 0"/><circle cx="12" cy="9" r="1.5"/><path d="M8 20h8"/>',
 cF:'<path d="M5 19c2-6 4 0 7-6s5-2 7-8"/><circle cx="5" cy="19" r="1.6"/><circle cx="19" cy="5" r="1.6"/>',
 cG:'<rect x="4" y="6" width="16" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M8 6l1.5-2h5L16 6"/>',

 cK:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8 8l2.5 2.5M16 8l-2.5 2.5"/><rect x="10" y="10" width="4" height="4" rx="1"/><path d="M12 14v4M10 20h4"/>',

};
const ico=(k,tag)=>`<div class="ico"><svg viewBox="0 0 24 24">${SV[k]}</svg>${tag?`<i>${tag}</i>`:''}</div>`;

/* ===================== references (international cases) ===================== */
const R={
 cessford:{ref:'Cessford, G., & Muhar, A. (2003). Monitoring options for visitor numbers in national parks and natural areas. <i>Journal for Nature Conservation, 11</i>(4), 240–250.',doi:'10.1078/1617-1381-00055',sum:'系統整理國家公園與自然區域常用的遊客人數監測方法，比較各類自動計數器、人工觀察與調查的適用情境與限制，並強調自動計數必須搭配人工觀察校正，數字才可信。'},
 noaa:{ref:'Paudyal, R., Ball Gonyo, S., & Clark Fobia, A. (2025). <i>Outdoor recreation study: Counter calibration and visitor assessment report</i>. NOAA National Centers for Coastal Ocean Science.',doi:'10.25923/srr4-r391',sum:'美國國家海洋暨大氣總署在維吉尼亞州約克河沿岸與密西西比州 Grand Bay 研究保護區設置車輛與行人計數器，說明計數器的校正流程，以及如何把原始計數轉換為可用的到訪量資料。'},
 mitter:{ref:'Mitterwallner, V., Peters, A., Edelhoff, H., et al. (2023). Automated visitor and wildlife monitoring with camera traps and machine learning. <i>Remote Sensing in Ecology and Conservation</i>.',doi:'10.1002/rse2.367',sum:'以開源物件偵測模型 MegaDetector 處理三個地區、超過 30 萬張自動相機影像，辨識人、動物與車輛的準確率皆超過九成，並與人工判讀的長期時間序列高度一致，顯示可在符合隱私規範下長期監測遊客與野生動物活動。'},
 lupp:{ref:'Lupp, G., Kantelberg, V., Förster, B., et al. (2021). Visitor counting and monitoring in forests using camera traps: A case study from Bavaria (Southern Germany). <i>Land, 10</i>(7), 736.',doi:'10.3390/land10070736',sum:'在德國巴伐利亞的森林以原本用於野生動物的自動相機監測遊客，除了人數也能記錄活動類型；但人工判讀影像耗費大量人力，研究因此建立照片張數與通過人數的換算係數。'},
 jenkins:{ref:'Jenkins, J. S., Marshall, A. M., Shiflett, S. A., et al. (2025). Snow droughts, deluge, and reservation systems interact to drive recreation access at Yosemite National Park. <i>Scientific Reports</i>.',doi:'10.1038/s41598-025-21022-5',sum:'以優勝美地國家公園各入口的交通計數與預約制度資料，分析極端積雪與日間預約制度如何共同影響到訪量與壅塞；沒有預約制度的年份，道路封閉使遊客集中、交通壅塞加劇。'},
 miller:{ref:'Miller, Z. D., Tendick, A., Meyer, C., et al. (2023). Comparing visitor perceptions, characteristics, and support for management actions before and during a pilot timed entry system at Arches National Park. <i>Sustainability, 15</i>(13), 10035.',doi:'10.3390/su151310035',sum:'拱門國家公園試辦分時入園預約制度，比較試辦前後的遊客調查：步道上的體驗品質提升，遊客組成沒有明顯改變，遊客也更早規劃行程、對分時入園的支持度提高。'},
 ahas:{ref:'Ahas, R., Aasa, A., Roose, A., Mark, Ü., & Silm, S. (2008). Evaluating passive mobile positioning data for tourism surveys: An Estonian case study. <i>Tourism Management, 29</i>(3), 469–486.',doi:'10.1016/j.tourman.2007.05.014',sum:'以愛沙尼亞為例，評估電信業者被動記錄的手機定位資料能否用於觀光統計，並與住宿統計等傳統資料比較，討論其涵蓋範圍、代表性與隱私等優勢和限制。'},
 korpilo:{ref:'Korpilo, S., Virtanen, T., & Lehvävirta, S. (2017). Smartphone GPS tracking—Inexpensive and efficient data collection on recreational movement. <i>Landscape and Urban Planning, 157</i>, 608–617.',doi:'10.1016/j.landurbplan.2016.08.005',sum:'以智慧型手機 GPS 軌跡記錄芬蘭都市森林中遊憩者的移動，說明這種方式能以低成本取得路線、使用強度與離開正式步道的空間資訊，可作為步道管理的依據。'},
 norman:{ref:'Norman, P., & Pickering, C. M. (2017). Using volunteered geographic information to assess park visitation: Comparing three on-line platforms. <i>Applied Geography, 89</i>, 163–172.',doi:'10.1016/j.apgeog.2017.11.001',sum:'比較三種線上平台的志願地理資訊用於評估公園使用的效果，指出不同平台代表不同的使用者與活動，需要依管理問題選擇或搭配使用。'},

  <div class="two"><div class="sec"><h4>可能回答的問題</h4><ul>${x.can.map(v=>`<li>${v}</li>`).join('')}</ul></div><div class="sec no"><h4>回答不了的事</h4><ul>${x.cant.map(v=>`<li>${v}</li>`).join('')}</ul></div></div>
  <div class="sec"><h4>代表性與偏差</h4><p>${x.bias}</p></div>
  <div class="two"><div class="sec"><h4>成本與維運</h4><p>${x.cost}</p></div><div class="sec"><h4>隱私與權責</h4><p>${x.privacy}</p></div></div>
  <div class="sec"><h4>國外案例</h4>${x.cases.map(caseBox).join('')}</div>
  <div class="sec"><h4>常見搭配</h4><div class="links">${x.pair.map(c=>lk('c',c)).join('')}</div></div>
  <div class="sec"><h4>可支援的 B 管理業務</h4><div class="links">${bs.map(b=>lk('b',b)).join('')||'—'}</div></div>
  <div class="sec"><h4>相關的 A 管理挑戰</h4><div class="links">${as.map(a=>lk('a',a)).join('')||'—'}</div></div>
  <div class="mnav"><button data-m="c-${keys[(i+keys.length-1)%keys.length]}">‹ 上一類</button><button data-m="c-${keys[(i+1)%keys.length]}">下一類 ›</button></div>`;}
 return '';
}
function openModal(id){const [t,k]=id.split('-');const h=modalHTML(t,k);if(!h)return;SH.innerHTML=`<button class="close" aria-label="關閉">×</button>`+h;MOD.classList.add('show');MOD.scrollTop=0;document.body.style.overflow='hidden';}
function closeModal(){MOD.classList.remove('show');document.body.style.overflow='';}
document.addEventListener('click',e=>{const m=e.target.closest('[data-m]');if(m){e.preventDefault();openModal(m.dataset.m);return;}
 if(e.target.closest('.close')||e.target===MOD)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function route(){const h=(location.hash||'#home').slice(1);closeModal();V.innerHTML=(views[h]||views.home)();
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===(views[h]?h:'home')));window.scrollTo(0,0);}
addEventListener('hashchange',route);route();
</script>
</body>
